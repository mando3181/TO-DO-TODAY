<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مَسار — الإقفالات والمهام المالية</title>
<meta name="description" content="متابعة الإقفالات اليومية والمهام وحجم الإنجاز للإدارة المالية">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&display=swap">
<style>
[hidden]{display:none!important}
img{max-width:100%}
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --surface-2:#E9EDE8; --sunken:#F7F8F6;
  --ink:#16201C; --ink-2:#46534D; --ink-3:#77837D; --line:#D9DFDA; --line-2:#C6CEC8;
  --accent:#0D6A59; --accent-hover:#0A5749; --accent-ink:#FFFFFF; --accent-soft:#D9ECE6;
  --gold:#A8701A; --gold-soft:#F4E8D2;
  --ok:#2A7A4B; --ok-soft:#DCEFE2; --ok-mid:#8CC7A2; --warn:#A5620A; --warn-soft:#F8E9CC;
  --bad:#B02A20; --bad-soft:#F7DEDB; --info:#2D5B99; --info-soft:#DDE7F5;
  --shadow:0 1px 2px rgba(18,30,25,.06),0 6px 20px rgba(18,30,25,.07);
  --radius:10px;
  --font:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --display:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1412; --surface:#171E1B; --surface-2:#1F2824; --sunken:#131917;
    --ink:#E4EBE7; --ink-2:#B1BDB7; --ink-3:#7F8C86; --line:#2A3530; --line-2:#37443E;
    --accent:#3DB39A; --accent-hover:#52C3AB; --accent-ink:#06201A; --accent-soft:#17362F;
    --gold:#E0A64A; --gold-soft:#3A2E1A;
    --ok:#5CC486; --ok-soft:#18321F; --ok-mid:#2F6B45; --warn:#E7A84A; --warn-soft:#3A2B14;
    --bad:#F07C72; --bad-soft:#3D1D1A; --info:#7FA8E6; --info-soft:#1A2A40;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1412; --surface:#171E1B; --surface-2:#1F2824; --sunken:#131917;
  --ink:#E4EBE7; --ink-2:#B1BDB7; --ink-3:#7F8C86; --line:#2A3530; --line-2:#37443E;
  --accent:#3DB39A; --accent-hover:#52C3AB; --accent-ink:#06201A; --accent-soft:#17362F;
  --gold:#E0A64A; --gold-soft:#3A2E1A;
  --ok:#5CC486; --ok-soft:#18321F; --ok-mid:#2F6B45; --warn:#E7A84A; --warn-soft:#3A2B14;
  --bad:#F07C72; --bad-soft:#3D1D1A; --info:#7FA8E6; --info-soft:#1A2A40;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-inline-end:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;height:100dvh}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:18px}
.brand b{font-family:var(--display);font-size:20px;font-weight:700}
.brand small{display:block;color:var(--ink-3);font-size:11.5px;margin-top:-3px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:9px 10px;border-radius:8px;color:var(--ink-2);text-align:start;font-weight:500}
.nav button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .count{margin-inline-start:auto;font-size:11.5px;background:var(--bad-soft);color:var(--bad);padding:0 7px;border-radius:20px;font-weight:600}
.nav .count.g{background:var(--gold-soft);color:var(--gold)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--ink-3)}
.conn{display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
.dot.on{background:var(--ok)} .dot.local{background:var(--warn)}

.main{min-width:0;padding-inline:28px;padding-block:22px 60px;display:flex;flex-direction:column;gap:18px}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topbar h1{font-family:var(--display);font-weight:700;font-size:25px;margin:0;line-height:1.3;text-wrap:balance}
.topbar .sub{color:var(--ink-3);font-size:13px}
.topbar .spacer{flex:1}
.me{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:30px;padding:4px 6px 4px 12px}
.me label{font-size:12px;color:var(--ink-3)}
.me select{border:0;background:transparent;font-weight:600;padding:3px 2px;max-width:170px}
.me .role{font-size:11px;color:var(--accent);background:var(--accent-soft);border-radius:20px;padding:0 8px;font-weight:600;white-space:nowrap}

/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);padding:7px 13px;border-radius:8px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{background:var(--accent-hover)}
.btn.okb{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.input,.select{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:0}
.input:focus,.select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.search{flex:1 1 200px;max-width:320px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:6px;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.datenav{display:inline-flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.datenav button{border:0;background:transparent;border-radius:7px;padding:5px 9px;color:var(--ink-2);display:grid;place-items:center}
.datenav button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.datenav button:hover{background:var(--surface-2)}
.datenav button:disabled{opacity:.35;cursor:default}
.datenav input{border:0;background:transparent;padding:4px 6px;font-weight:600}
.dayname{font-weight:700;font-size:15px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:20px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;line-height:1.7}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.info{background:var(--info-soft);color:var(--info)}
.chip.gold{background:var(--gold-soft);color:var(--gold)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.sample{background:transparent;border:1px dashed var(--line-2);color:var(--ink-3);font-weight:500}
.av{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none}
.av.lg{width:42px;height:42px;font-size:15px}
.who{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);min-width:0}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;min-width:0}
.panel h2{font-size:15px;margin:0 0 14px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel h2 .muted{font-weight:400;font-size:13px}
.panel h2 .btn{margin-inline-start:auto}
.muted{color:var(--ink-3)}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi .l{font-size:12.5px;color:var(--ink-3);font-weight:500}
.kpi .v{font-size:24px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi .h{font-size:12px;color:var(--ink-3)}
.kpi.alert .v{color:var(--bad)} .kpi.goldk .v{color:var(--gold)}
.empty{padding:22px;text-align:center;color:var(--ink-3);border:1px dashed var(--line-2);border-radius:var(--radius);font-size:13px}

/* bars */
.rows{display:flex;flex-direction:column;gap:12px}
.brow{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 84px;align-items:center;gap:12px;font-size:13px}
.brow .val{text-align:end;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.stack{display:flex;height:14px;border-radius:5px;overflow:hidden;background:var(--sunken);border:1px solid var(--line)}
.stack span{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:12px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-inline-end:5px}
.bar{height:6px;border-radius:4px;background:var(--sunken);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600;overflow-wrap:anywhere}
.li .s{font-size:12px;color:var(--ink-3)}
.act{font-size:13px;color:var(--ink-2)}
.act b{color:var(--ink);font-weight:600}

/* type totals */
.ttl{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.tt{background:var(--sunken);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.tt .l{font-size:12px;color:var(--ink-3);font-weight:600}
.tt .v{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.tt .v.bad{color:var(--bad)}
.tt .s{font-size:11.5px;color:var(--ink-3)}

/* closing items */
.dgroup{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.dhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--sunken)}
.dhead h3{margin:0;font-size:15.5px}
.dhead .prog{flex:1 1 160px;max-width:260px}
.mhead{display:flex;align-items:center;gap:8px;padding:10px 16px 4px;font-weight:600;font-size:13px;color:var(--ink-2)}
.irow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:10px 16px;border-top:1px solid var(--line);cursor:pointer}
.mhead+.irow{border-top:0}
.irow:hover{background:var(--sunken)}
.irow .c-main{flex:1 1 230px;min-width:0;display:flex;align-items:center;gap:8px}
.irow .c-main .t{font-weight:600;overflow-wrap:anywhere}
.irow .c-val{flex:0 1 250px;font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.irow .c-val b{color:var(--ink)}
.irow .c-st{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;flex:0 0 auto}
.tchip{font-size:11px;font-weight:700;padding:1px 7px;border-radius:5px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.varbad{color:var(--bad);font-weight:700}

/* heatmap */
.hmwrap{overflow-x:auto}
.hm{border-collapse:separate;border-spacing:3px;min-width:0;width:auto}
.hm th,.hm td{padding:0;border:0;background:transparent;text-align:center;font-weight:500}
.hm th{font-size:10.5px;color:var(--ink-3);padding-bottom:4px;min-width:26px;line-height:1.3}
.hm td.nm{text-align:start;padding-inline-end:10px;font-size:12.5px;white-space:nowrap;color:var(--ink-2)}
.hm tr.dep td{font-size:11.5px;font-weight:700;color:var(--ink-3);padding-top:8px;text-align:start}
.hc{display:block;width:24px;height:24px;border-radius:5px;margin:auto;position:relative;border:0;padding:0}
.h4{background:var(--ok)} .h3{background:var(--ok-mid)} .h2{background:var(--warn)} .h0{background:var(--bad)}
.hf{background:var(--surface-2);outline:1px dashed var(--line-2);outline-offset:-1px} .hn{background:transparent}
.hc.late::after{content:"";position:absolute;inset-inline-end:3px;top:3px;width:6px;height:6px;border-radius:50%;background:var(--surface)}
tbody tr.cl{cursor:pointer}
tbody tr.cl:hover{background:var(--sunken)}

/* table */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;min-width:820px}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--ink-3);font-weight:600;background:var(--sunken)}
tbody tr:last-child td{border-bottom:0}
td .t,td.t{font-weight:600}
td .s,td.s{font-size:12px;color:var(--ink-3)}
tr.sub td{background:var(--sunken);font-weight:700;font-size:13px}
.score{display:flex;align-items:center;gap:8px;min-width:110px}
.score .bar{flex:1}

/* board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px;align-items:start}
.col{background:var(--surface-2);border-radius:var(--radius);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:140px}
.col.over{outline:2px dashed var(--accent);outline-offset:-2px}
.colhead{display:flex;align-items:center;gap:8px;padding:2px 4px 4px;font-weight:700;font-size:13.5px}
.colhead .n{font-weight:600;color:var(--ink-3);font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 11px;display:flex;flex-direction:column;gap:7px;cursor:pointer}
.card:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.card[draggable="true"]{cursor:grab}
.card.dragging{opacity:.45}
.card .t{font-weight:600;overflow-wrap:anywhere;line-height:1.45}
.card .row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--ink-3)}
.card .row .sp{flex:1}
.card.done .t{text-decoration:line-through;color:var(--ink-3)}
.check{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line-2);background:var(--surface);display:grid;place-items:center;flex:none;padding:0}
.check.on{background:var(--ok);border-color:var(--ok)}
.check svg{width:12px;height:12px;stroke:#fff;stroke-width:3;fill:none}

/* org */
.orgtop{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:flex;align-items:center;gap:12px;min-width:0}
.pcard.cfo{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.pcard .grow{flex:1;min-width:0}
.pcard .nm{font-weight:700}
.pcard .rl{font-size:12px;color:var(--ink-3)}
.orgline{height:22px;width:2px;background:var(--line-2);margin:0 auto}
.sector{display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--sunken)}
.sector>.sech{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sector>.sech h2{margin:0;font-family:var(--display);font-size:19px}
.company{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.company .comph{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.company .comph h3{margin:0;font-size:16px}
.company .sub{font-size:12.5px;font-weight:700;color:var(--ink-3)}
.company .depts{border-top:0;padding-top:0}
.brlist{display:flex;flex-wrap:wrap;gap:6px}
.brchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12.5px;background:var(--surface);cursor:pointer}
.brchip:hover{border-color:var(--line-2)}
.brchip .s{color:var(--ink-3)}
.orgtree{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--ink-3)}
.depts{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;border-top:2px solid var(--line-2);padding-top:18px}
.dept{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;overflow:hidden}
.dept .dh{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dept .dh h3{margin:0;font-size:15.5px;flex:1}
.dept .headp{padding:12px 16px;display:flex;align-items:center;gap:10px;background:var(--sunken);border-bottom:1px solid var(--line)}
.dept .mem{padding:9px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);cursor:pointer}
.dept .mem:last-child{border-bottom:0}
.dept .mem:hover{background:var(--sunken)}
.dept .mem .grow,.dept .headp .grow{flex:1;min-width:0}
.dept .mem .s,.dept .headp .s{font-size:12px;color:var(--ink-3)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(10,18,15,.45);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px 16px;z-index:50;overflow-y:auto}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column}
.modal header{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.modal header h3{margin:0;font-size:17px;flex:1;min-width:0;overflow-wrap:anywhere}
.modal .body{padding:18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.modal footer{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.modal footer .spacer{flex:1}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.field label .req{color:var(--bad)}
.field .input,.field .select{width:100%}
.field textarea.input{min-height:76px;resize:vertical}
.field .err{font-size:12px;color:var(--bad)}
.field .hint{font-size:12px;color:var(--ink-3)}
.varbox{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;background:var(--sunken);font-size:13.5px;flex-wrap:wrap}
.varbox b{font-size:16px;font-variant-numeric:tabular-nums}
.varbox.bad{background:var(--bad-soft)} .varbox.bad b{color:var(--bad)}
.varbox.ok{background:var(--ok-soft)} .varbox.ok b{color:var(--ok)}
.note{grid-column:1/-1;border-radius:8px;padding:10px 14px;font-size:13.5px}
.note.bad{background:var(--bad-soft)} .note.info{background:var(--sunken)}
.meta{grid-column:1/-1;display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--ink-3);border-top:1px solid var(--line);padding-top:10px}
.checks{display:flex;gap:6px;flex-wrap:wrap}
.checks label{display:inline-flex;align-items:center;gap:5px;background:var(--sunken);border:1px solid var(--line);border-radius:7px;padding:4px 10px;font-size:13px;cursor:pointer}

.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--gold-soft);color:var(--ink);border-radius:var(--radius);padding:12px 16px;font-size:13.5px}
.banner b{color:var(--gold)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline-start:50%;transform:translateX(50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:30px;font-size:13.5px;z-index:80;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

/* guide */
.guide{display:grid;grid-template-columns:210px minmax(0,1fr);gap:24px;align-items:start}

.doc{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:8px 30px 30px;max-width:840px}
.doc section{padding-top:22px;border-top:1px solid var(--line);margin-top:22px}
.doc section:first-child{border-top:0;margin-top:0}
.doc h2{font-family:var(--display);font-size:21px;font-weight:700;margin:0 0 10px;text-wrap:balance}
.doc h3{font-size:15px;margin:18px 0 6px}
.doc p,.doc li{max-width:68ch;color:var(--ink-2);font-size:14.5px;line-height:1.85}
.doc ol,.doc ul{padding-inline-start:22px}

.doc .tip{background:var(--accent-soft);border-radius:8px;padding:12px 16px;color:var(--ink);font-size:14px;margin:12px 0}

.doc table{min-width:520px;font-size:13.5px}

.doc .tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;margin:10px 0}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0}
.flow .arr{color:var(--ink-3)}
.kbd{font-size:12px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:5px;padding:0 6px;font-weight:600;color:var(--ink)}

/* permissions */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.pchk{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer}
.pchk:hover{border-color:var(--line-2)}
.pchk input{margin-top:3px;flex:none}
.pchk .d{font-size:11.5px;color:var(--ink-3);display:block}
.pchk.on{border-color:var(--accent);background:var(--accent-soft)}
.pchk.dis{opacity:.7;cursor:default}
.pgroup{font-size:12.5px;font-weight:700;color:var(--ink-3);margin:14px 0 6px}
tr.sel td{background:var(--accent-soft)}
.permhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* banks & cash */
.bcin{width:120px;border:1px solid var(--line-2);border-radius:6px;padding:5px 6px;background:var(--surface);text-align:end}
.bcin[type="date"]{width:140px;text-align:start}
.bcin.note{width:200px;text-align:start}
.bcin:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.bcin:disabled{background:var(--sunken);color:var(--ink-2);border-color:var(--line)}
.bcrow.dirty td:first-child{box-shadow:inset -3px 0 0 var(--gold)}
.bctable{min-width:1100px}
.bctable th,.bctable td{padding:6px 8px;font-size:12.5px;white-space:nowrap}
.bctable td.l{white-space:normal;min-width:120px}
.bctable td.calc{background:var(--sunken);font-weight:600;text-align:end}
.bctable tr.co td{background:var(--sunken);font-weight:700}
.bctable tfoot td{font-weight:700;background:var(--surface-2);border-top:2px solid var(--line-2)}
.bcsub{font-size:14px;font-weight:700;margin:6px 0 0}

/* revenue report */
.reptable{min-width:1700px}
.reptable th,.reptable td{padding:6px 8px;font-size:12.5px;white-space:nowrap;text-align:center}
.reptable thead th{background:var(--sunken);line-height:1.35;white-space:normal;vertical-align:middle;border:1px solid var(--line)}
.reptable thead tr.grp th{background:var(--surface-2);color:var(--ink);font-size:12.5px}
.reptable td{border-inline-start:1px solid var(--line)}
.reptable td.l{text-align:start;white-space:normal;min-width:130px}
.reptable .rvname{position:sticky;inset-inline-start:0;background:var(--surface);z-index:1}
.reptable tfoot td{font-weight:700;background:var(--surface-2);border-top:2px solid var(--line-2)}
.reptable tfoot .rvname{background:var(--surface-2)}
.reptable tr.co td{background:var(--sunken);font-weight:700}
.rephead{display:flex;flex-direction:column;gap:2px}
.rephead h2{margin:0;font-family:var(--display);font-size:19px}
.imp-file{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.imp-file .hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.imp-file .hd b{flex:1;min-width:0;overflow-wrap:anywhere}
.imp-warn{font-size:12.5px;color:var(--warn)}

/* revenue form */
.revtable{min-width:1600px}
.revtable th,.revtable td{padding:6px 8px;font-size:12.5px;white-space:nowrap}
.revtable th{line-height:1.35;white-space:normal;min-width:70px}
.revtable .rvname{position:sticky;inset-inline-start:0;background:var(--surface);z-index:1;min-width:160px;white-space:normal}
.revtable tfoot .rvname{background:var(--surface-2)}
.rvin{width:96px;border:1px solid var(--line-2);border-radius:6px;padding:5px 6px;background:var(--surface);text-align:end}
.rvin:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.rvin:disabled{background:var(--sunken);color:var(--ink-2);border-color:var(--line)}
.rvnote{width:180px;text-align:start}
.revtable td.calc{background:var(--sunken);font-weight:600;text-align:end}
.revtable tfoot td{font-weight:700;background:var(--surface-2);border-top:2px solid var(--line-2)}
.rvrow.dirty .rvname{box-shadow:inset -3px 0 0 var(--gold)}
.neg{color:var(--bad);font-weight:700}.pos{color:var(--ok);font-weight:700}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.fgrid .field.full{grid-column:1/-1}

/* attachments */
.att-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.att{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line);min-width:0}

.att .grow{flex:1;min-width:0}
.att .t{font-weight:600;font-size:13px;overflow-wrap:anywhere}
.att .s{font-size:11.5px;color:var(--ink-3)}
.fx{flex:none;width:38px;height:26px;border-radius:5px;display:inline-grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff;letter-spacing:.03em}
.fx-xl{background:#1D6F42}.fx-wd{background:#2B579A}.fx-pdf{background:#B3261E}.fx-img{background:#6B5BA8}.fx-oth{background:var(--ink-3)}
.att-busy{margin-top:8px;font-size:12.5px;color:var(--info);font-weight:600}
.chip svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.linkish{border:0;background:none;padding:0;color:var(--accent);text-align:start;cursor:pointer;font-weight:600}
.linkish:hover{text-decoration:underline}

/* login gate */
.gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:24px 16px;overflow-y:auto}
.gcard{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 24px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.gcard .brand{justify-content:center;padding:0}
.gcard h2{margin:0;font-size:18px;text-align:center}
.gcard p{margin:0;color:var(--ink-2);font-size:13.5px;text-align:center;line-height:1.7}
.gcard form{display:flex;flex-direction:column;gap:10px}
.gcard .input{width:100%}
.gcard .btn{justify-content:center}
.gerr{color:var(--bad);font-size:13px;text-align:center;min-height:1.2em}
.linkbtn{border:0;background:none;color:var(--accent);font-size:13px;padding:2px;text-decoration:underline}
.glinks{display:flex;justify-content:center;gap:16px;flex-wrap:wrap}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

  .side .brand small,.side-foot,.side .brand b{display:none}

<div class="app" dir="rtl" lang="ar">
  <aside class="side">
    <div class="brand"><div class="brand-mark">م</div><div><b>مَسار</b><small>الإقفالات والمهام المالية</small></div></div>

<template id="guideTpl">
<div class="guide">
  <nav class="toc" aria-label="محتويات الدليل">
    <a href="#g-idea">فكرة النظام</a><a href="#g-start">التجهيز لأول مرة</a><a href="#g-share">الدخول والصلاحيات</a><a href="#g-matrix">مصفوفة الإقفال</a><a href="#g-close">الإقفال اليومي</a><a href="#g-approve">الاعتماد والإرجاع</a><a href="#g-dash">لوحة المتابعة</a><a href="#g-tasks">المهام</a><a href="#g-perf">الإنجاز والأداء</a><a href="#g-rev">تسجيل الإيرادات</a><a href="#g-rrep">تقرير الإيرادات</a><a href="#g-bc">البنوك والصندوق</a><a href="#g-perm">الصلاحيات</a><a href="#g-org">الهيكل التنظيمي</a><a href="#g-files">المرفقات والتقارير</a><a href="#g-routine">روتين العمل</a><a href="#g-faq">أسئلة شائعة</a>
  </nav>
  <article class="doc">
    <section id="g-idea">
      <h2>فكرة النظام</h2>
      <p><strong>مَسار</strong> يتابع عمل الإدارة المالية على ثلاثة مستويات تطابق هيكلكم:</p>
      <div class="flow"><span class="chip acc">المدير المالي</span><span class="arr">←</span><span class="chip info">رؤساء الأقسام</span><span class="arr">←</span><span class="chip">المحاسبون</span></div>
      <p>وفيه نوعان من العمل:</p>
      <ul>
        <li><strong>الإقفالات اليومية:</strong> أعمال متكررة كل يوم عمل: الإيرادات، وحركة البنوك، والصندوق (الكاش)، والمشتريات، والمصاريف، والعهد، وأي نوع تضيفه. يُقفل كل بند محاسبٌ محدد، ويعتمده رئيس قسمه.</li>
        <li><strong>المهام:</strong> أعمال غير متكررة أو دورية، مثل تسوية بنكية شهرية أو إقرار ضريبي أو مراجعة قيود، ولكل مهمة مسؤول وموعد وحالة.</li>
      </ul>
      <p>ومن الاثنين يحسب النظام <strong>حجم الإنجاز والانضباط</strong> لكل محاسب وكل قسم تلقائياً.</p>
    </section>
    <section id="g-start">
      <h2>التجهيز لأول مرة</h2>
      <p>التجهيز من مسؤولية المدير المالي، ويستغرق حوالي 20 دقيقة:</p>
      <ol>
        <li><strong>احذف البيانات التجريبية:</strong> من «إعداد الإقفال» ← «حذف البيانات التجريبية». السجلات التجريبية معلّمة بشارة «مثال».</li>
        <li><strong>أضف نفسك:</strong> من «الهيكل التنظيمي» ← «إضافة موظف»، واختر الدور «المدير المالي»، واكتب نفس البريد الذي تسجّل به الدخول.</li>
        <li><strong>أنشئ الأقسام:</strong> «قسم جديد»، مثل الخزينة والبنوك، والإيرادات، والمشتريات والمصروفات.</li>
        <li><strong>أضف رؤساء الأقسام والمحاسبين</strong> وحدد لكل منهم دوره وقسمه. عند إضافة رئيس قسم يُعيَّن تلقائياً رئيساً لقسمه.</li>
        <li><strong>راجع أنواع الإقفال</strong> في «إعداد الإقفال»، وأضف ما تحتاجه (مثل المخزون أو الذمم المدينة).</li>
        <li><strong>ابنِ مصفوفة الإقفال:</strong> بند لكل عمل يومي ومن المسؤول عنه (التفاصيل في القسم التالي).</li>
        <li><strong>اضبط المواعيد:</strong> أيام العطلة الأسبوعية، وموعد تسليم الإقفال.</li>
        <li><strong>فعّل دخول الفريق:</strong> تأكد أن لكل موظف بريداً إلكترونياً في بطاقته، ثم أرسل لهم رابط النظام لينشئوا حساباتهم بنفس البريد.</li>
      </ol>
    </section>
    <section id="g-share">
      <h2>الدخول والصلاحيات</h2>
      <p>كل موظف يدخل بحسابه الخاص: البريد الإلكتروني وكلمة المرور. يتعرّف النظام على الموظف تلقائياً من بريده، فيعرف دوره وقسمه وبنوده.</p>
      <ol>
        <li>يضيف المدير المالي الموظف في «الهيكل التنظيمي» مع بريده الإلكتروني، فيُفعَّل دخول هذا البريد تلقائياً.</li>
        <li>يفتح الموظف رابط النظام، ويضغط «إنشاء حساب جديد» بنفس البريد، ثم يؤكد بريده من الرسالة التي تصله.</li>
        <li>يسجّل الدخول، فيرى إقفالاته ومهامه وصلاحيات دوره.</li>
      </ol>
      <p>عند حذف موظف من الهيكل، أو تغيير بريده، يتوقف دخوله بالبريد القديم تلقائياً.</p>
      <div class="tw"><table><thead><tr><th>الدور</th><th>ما يستطيع فعله</th></tr></thead><tbody>
        <tr><td><strong>المدير المالي</strong></td><td>كل شيء: الهيكل، والإعداد، واعتماد أي إقفال، وإلغاء الاعتماد، ومتابعة كل الأقسام، والنسخ الاحتياطي</td></tr>
        <tr><td><strong>رئيس القسم</strong></td><td>اعتماد إقفالات محاسبي قسمه أو إرجاعها، والإدخال نيابة عنهم عند الغياب، وتعديل مصفوفة الإقفال</td></tr>
        <tr><td><strong>المحاسب</strong></td><td>إدخال إقفالاته وإرسالها للاعتماد، وتحديث مهامه، والاطلاع على لوحة المتابعة</td></tr>
      </tbody></table></div>
      <div class="warnbox">قواعد قاعدة البيانات تمنع أي شخص غير مضاف في الهيكل التنظيمي من القراءة أو الكتابة. أما توزيع الصلاحيات بين الأدوار (من يعتمد ومن يعدّل الإعداد) فتطبّقه واجهة النظام.</div>
    </section>
    <section id="g-matrix">
      <h2>مصفوفة الإقفال</h2>
      <p>هي قلب النظام. كل <strong>بند</strong> فيها يمثّل عملاً يُقفل يومياً، ويحدد ثلاثة أشياء: <strong>النوع</strong>، و<strong>الوصف</strong>، و<strong>المحاسب المسؤول</strong>. أمثلة:</p>
      <div class="tw"><table><thead><tr><th>النوع</th><th>البند</th><th>المسؤول</th></tr></thead><tbody>
        <tr><td>حركة البنوك</td><td>بنك الراجحي — الحساب الجاري</td><td>محاسب البنوك</td></tr>
        <tr><td>حركة البنوك</td><td>البنك الأهلي — حساب التحصيل</td><td>محاسب البنوك</td></tr>
        <tr><td>الصندوق</td><td>الصندوق الرئيسي</td><td>أمين الصندوق</td></tr>
        <tr><td>الإيرادات</td><td>إيرادات فرع جدة</td><td>محاسب الإيرادات</td></tr>
      </tbody></table></div>
      <p>في كل يوم عمل ينشئ النظام تلقائياً قائمة إقفال من هذه البنود. البند الجديد يُطبَّق من يوم إضافته فصاعداً. وإذا انتقل العمل إلى محاسب آخر، عدّل المسؤول في البند؛ فالأيام السابقة تحتفظ بمسؤولها الأصلي.</p>
      <h3>نوعا الإقفال</h3>
      <ul>
        <li><strong>إقفال بمبلغ</strong> (الإيرادات، المشتريات، المصاريف): يُدخل المحاسب عدد المستندات أو القيود وإجمالي المبلغ.</li>
        <li><strong>إقفال بمطابقة</strong> (البنوك، الصندوق، العهد): يُدخل الرصيد الدفتري والرصيد الفعلي (كشف البنك، أو الجرد، أو المستندات)، ويحسب النظام <strong>الفرق</strong>. إذا وُجد فرق فلا يُرسل الإقفال قبل كتابة تفسيره.</li>
      </ul>
    </section>
    <section id="g-close">
      <h2>الإقفال اليومي — للمحاسب</h2>
      <ol>
        <li>افتح «الإقفال اليومي». يفتح النظام تلقائياً على اليوم المستحق إقفاله.</li>
        <li>اختر «إقفالاتي» من فلتر الموظف لترى بنودك فقط.</li>
        <li>اضغط على البند، وأدخل الأرقام والملاحظات.</li>
        <li>اختر واحداً من ثلاثة:
          <ul>
            <li><strong>حفظ كمسودة:</strong> إذا لم تنتهِ بعد، وتصبح حالته «قيد العمل».</li>
            <li><strong>لا توجد حركة:</strong> إذا لم تكن هناك حركة في ذلك اليوم.</li>
            <li><strong>إقفال وإرسال للاعتماد:</strong> ينتقل البند إلى رئيس القسم.</li>
          </ul>
        </li>
      </ol>
      <h3>دورة حياة البند</h3>
      <div class="flow"><span class="chip">لم يبدأ</span><span class="arr">←</span><span class="chip info">قيد العمل</span><span class="arr">←</span><span class="chip gold">بانتظار الاعتماد</span><span class="arr">←</span><span class="chip ok">معتمد</span></div>
      <p>وإذا أرجعه رئيس القسم يصبح <span class="chip bad">مُعاد للتعديل</span> مع ملاحظة توضح المطلوب، فيعدّله المحاسب ويرسله من جديد.</p>
      <h3>موعد التسليم والتأخير</h3>
      <p>يُضبط الموعد من «إعداد الإقفال»، مثلاً: إقفال كل يوم يُسلَّم قبل الساعة 12:00 ظهر يوم العمل التالي. البند الذي يُرسل بعد الموعد يُعلَّم <span class="chip bad">متأخر</span> ويُحسب في مؤشر الانضباط، وكذلك البند الذي لم يُرسل حتى مضى موعده.</p>
    </section>
    <section id="g-approve">
      <h2>الاعتماد والإرجاع — لرئيس القسم</h2>
      <ol>
        <li>يظهر عدد البنود التي تنتظر اعتمادك بجانب «الإقفال اليومي» في القائمة.</li>
        <li>افتح البند وراجع الأرقام والفروقات وتفسيرها، ثم اختر <strong>اعتماد</strong> أو <strong>إرجاع للتعديل</strong>. عند الإرجاع اكتب ما يجب تصحيحه.</li>
        <li>لاعتماد كل البنود المرسلة في قسمك دفعة واحدة، استخدم زر <strong>«اعتماد كل المرسل»</strong> في رأس القسم.</li>
      </ol>
      <p>إقفالات رئيس القسم نفسه يعتمدها المدير المالي. ويستطيع المدير المالي أيضاً <strong>إلغاء اعتماد</strong> بند معتمد لإعادة فتحه.</p>
    </section>
    <section id="g-dash">
      <h2>لوحة المتابعة — للمدير المالي</h2>
      <ul>
        <li><strong>نسبة الإقفال:</strong> البنود المرسلة أو المعتمدة من إجمالي بنود اليوم.</li>
        <li><strong>بانتظار الاعتماد:</strong> ما أرسله المحاسبون ولم يُعتمد بعد، ومنه ما ينتظرك أنت.</li>
        <li><strong>متأخرة:</strong> بنود تجاوزت موعد التسليم دون إرسال.</li>
        <li><strong>فروقات:</strong> عدد بنود المطابقة التي فيها فرق، ومجموع الفروقات.</li>
        <li><strong>الإقفال حسب القسم:</strong> شريط ملوّن لكل قسم يوضح أين وصل.</li>
        <li><strong>إجماليات اليوم:</strong> إجمالي الإيرادات والمشتريات والمصاريف، وفروقات البنوك والصندوق والعهد.</li>
        <li><strong>خريطة الانضباط:</strong> مربع لكل محاسب في كل يوم من آخر 12 يوم عمل. <span class="chip ok">أخضر داكن</span> كل البنود معتمدة، و<span class="chip ok">أخضر فاتح</span> كل البنود مرسلة، و<span class="chip warn">برتقالي</span> بعض البنود فقط، و<span class="chip bad">أحمر</span> لا شيء وقد مضى الموعد. النقطة البيضاء داخل المربع تعني وجود بند أُرسل متأخراً. اضغط على أي مربع لفتح ذلك اليوم.</li>
      </ul>
    </section>
    <section id="g-tasks">
      <h2>المهام</h2>
      <p>للأعمال غير اليومية. أنشئ المهمة، وحدد التصنيف (تسوية بنكية، قيود تسوية، إقفال شهري، ضرائب وزكاة، تقارير…) والمسؤول والأولوية والموعد. أعمدة المهام: جديدة، ثم قيد التنفيذ، ثم بانتظار المراجعة، ثم مكتملة. ينقل المحاسب المهمة إلى «بانتظار المراجعة» عند إنهائها، ويعتمدها رئيس القسم بنقلها إلى «مكتملة».</p>
    </section>
    <section id="g-perf">
      <h2>الإنجاز والأداء</h2>
      <p>اختر الفترة (هذا الأسبوع، هذا الشهر، الشهر الماضي، آخر 30 يوماً) لترى لكل محاسب ولكل قسم:</p>
      <ul>
        <li><strong>الإقفالات المطلوبة والمنجزة</strong> ونسبة <strong>الإقفال في الموعد</strong>.</li>
        <li><strong>المتأخرة</strong> و<strong>المُعادة للتعديل</strong>. كثرة الإرجاع تعني وجود مشكلة في الجودة.</li>
        <li><strong>المهام المنجزة</strong> خلال الفترة، و<strong>المهام المتأخرة</strong> حالياً.</li>
        <li><strong>مؤشر الأداء:</strong> 70٪ منه للإقفال في الموعد، و30٪ لإنجاز المهام دون تأخير.</li>
      </ul>
      <p>لا يدخل الحساب إلا الأيام التي مضى موعد تسليمها. ويمكنك تصدير الجدول إلى Excel.</p>
    </section>
    <section id="g-rev">
      <h2>تسجيل الإيرادات (نموذج الفروع)</h2>
      <p>نفس نموذج تسجيل إيرادات الفروع اليومية، مدمج في النظام ومربوط بكل محاسب كمهمة إقفال يومية.</p>
      <h3>التجهيز (مرة واحدة)</h3>
      <ol>
        <li>من «إعداد الإقفال» ← <strong>الفروع وأجهزة الشبكة</strong>: أضف الفروع وأرقام أجهزة الشبكة، أو اضغط «استيراد ملف الفروع» واختر ملف <code>seed.json</code> من النظام السابق.</li>
        <li>من «إعداد الإقفال» أضف <strong>بند إقفال</strong> من نوع <strong>«نموذج إيرادات الفروع»</strong> لكل محاسب، واختر الفروع المسندة إليه.</li>
        <li>اضبط <strong>حد العجز/الفائض غير الطبيعي</strong> في لوحة المواعيد (7 ر.س افتراضياً).</li>
      </ol>
      <h3>العمل اليومي للمحاسب</h3>
      <ol>
        <li>افتح «تسجيل الإيرادات». تظهر فروعك فقط في تاريخ اليوم المستحق.</li>
        <li><strong>الإيرادات اليومية:</strong> أدخل لكل فرع النقدي والشبكة من النظام، ثم النقدي والشبكة الفعليين، والتحويل البنكي، والآجل، والمرتجع. يُحفظ الصف تلقائياً عند الانتقال لصف آخر، ويتنقل زر Enter بين الحقول.</li>
        <li><strong>سحب الشبكات:</strong> أدخل مبلغ كل جهاز. يقارن النظام مجموع الأجهزة مع «شبكة (فعلي)» للفرع.</li>
        <li><strong>العجز والفائض غير الطبيعي:</strong> سجّل الموظف والسبب لكل فرع تجاوز فرقه الحد.</li>
        <li>اضغط <strong>«إقفال وإرسال للاعتماد»</strong>. لا يُقبل الإرسال قبل تسجيل كل الفروع، وكتابة ملاحظة لكل حالة غير طبيعية.</li>
      </ol>
      <div class="tw"><table><thead><tr><th>الحقل</th><th>المعادلة</th></tr></thead><tbody>
        <tr><td>فرق النقدي</td><td>نقدي فعلي − نقدي نظام</td></tr>
        <tr><td>فرق الشبكة</td><td>(شبكة فعلي + تحويل بنكي + آجل) − شبكة نظام</td></tr>
        <tr><td>صافي الفرق</td><td>فرق النقدي + فرق الشبكة</td></tr>
        <tr><td>التصنيف</td><td>≥ الحد: فائض غير طبيعي · من 0 إلى أقل من الحد: فائض طبيعي · أكبر من (−الحد) وأقل من 0: عجز طبيعي · ≤ (−الحد): عجز غير طبيعي</td></tr>
      </tbody></table></div>
      <p>بعد الإرسال يُقفل النموذج لهذه الفروع، ويعتمده رئيس القسم كأي إقفال. ولتعديل نموذج بعد إرساله، استخدم «سحب الإرسال للتعديل» من البند، أو يلغي المدير المالي الاعتماد.</p>
      <div class="tip">إذا كانت الفروع تعمل كل أيام الأسبوع، فألغِ أيام العطلة من «إعداد الإقفال» حتى تظهر مهمة الإيرادات يومياً. يمكن تسجيل الإيرادات في أي يوم، لكن مهمة الإقفال لا تُنشأ إلا في أيام العمل.</div>
    </section>
    <section id="g-rrep">
      <h2>تقرير الإيرادات</h2>
      <p>يجمع إيرادات الفروع من نموذج «تسجيل الإيرادات» تلقائياً، بنفس شكل تقرير الإيرادات اليومي في Excel، ولأي فترة تختارها.</p>
      <ul>
        <li><strong>الفترة:</strong> اليوم، أو هذا الأسبوع، أو هذا الشهر، أو الشهر الماضي، أو من تاريخ إلى تاريخ.</li>
        <li><strong>التصفية:</strong> حسب المنشأة (الشركة) و/أو الفرع.</li>
        <li><strong>العرض:</strong> حسب الفروع، أو المنشآت، أو الأيام. في عرض الأيام، اضغط على اليوم لفتح نموذجه.</li>
        <li><strong>الأقسام:</strong> المبيعات، والشبكات (مجموع كل جهاز ومطابقته مع الشبكة الفعلية)، والعجز والفائض غير الطبيعي.</li>
      </ul>
      <p>أعمدة «فائض طبيعي / غير طبيعي» و«عجز طبيعي / غير طبيعي» تُصنَّف يوماً بيوم ثم تُجمع، كما لو جمعت تقارير Excel اليومية للفترة.</p>
      <h3>التصدير والاستيراد</h3>
      <ul>
        <li><strong>تصدير Excel:</strong> ينزّل ملفاً بثلاث أوراق (المبيعات، الشبكات، العجز والفائض) بنفس ترتيب أعمدة التقرير.</li>
        <li><strong>استيراد تقارير يومية:</strong> للمدير المالي ورؤساء الأقسام. اختر ملفاً أو أكثر من تقارير Excel اليومية (مثل R 7-07-2026.xlsx)، فيقرأ النظام التاريخ من اسم الملف ويعرضه للتأكيد، ثم يسجّل المبيعات والشبكات والعجز والفائض لذلك اليوم. والفروع أو الأجهزة غير الموجودة تُضاف تلقائياً.</li>
      </ul>
      <div class="warnbox">التاريخ المكتوب داخل بعض ملفات Excel غير دقيق (مثلاً سنة 2027 أو شهر خاطئ)، لذلك يعتمد الاستيراد على اسم الملف وينبّهك عند الاختلاف. راجع التاريخ قبل الضغط على «استيراد».</div>
    </section>
    <section id="g-bc">
      <h2>البنوك والصندوق</h2>
      <p>نفس تقرير «إقفالات وإغلاقات البنوك والصندوق» اليومي، بأربعة أقسام:</p>
      <div class="tw"><table><thead><tr><th>القسم</th><th>ما يُدخل</th><th>المعادلة</th></tr></thead><tbody>
        <tr><td>مطابقة أرصدة البنوك</td><td>رصيد البنك الفعلي، ورصيد البنك في الأوائل، لكل حساب</td><td>الفرق = الفعلي − الأوائل</td></tr>
        <tr><td>إغلاق وسيط المتحصلات النقدية</td><td>تاريخ الإقفال، وتحصيل الصندوق، ورصيد الوسيط، لكل فرع</td><td>الفرق = تحصيل الصندوق − رصيد الوسيط</td></tr>
        <tr><td>إغلاق تحصيل النقدية بالفروع</td><td>تاريخ آخر إيداع، وتاريخ آخر تحصيل، والتحصيل النقدي</td><td>رصيد الوسيط = −(فرق الوسيط) تلقائياً · الفرق = التحصيل − رصيد الوسيط</td></tr>
        <tr><td>إقفال الصندوق</td><td>الرصيد الفعلي والدفتري لكل صندوق</td><td>الفرق = الفعلي − الدفتري، وجدول إيداعات الفروع يُحسب تلقائياً لكل منشأة</td></tr>
      </tbody></table></div>
      <h3>طريقتا التحديث</h3>
      <ul>
        <li><strong>يدوياً:</strong> أدخل القيم في الجداول، ويُحفظ الصف تلقائياً عند الانتقال لصف آخر.</li>
        <li><strong>برفع ملف Excel:</strong> زر «استيراد من Excel» يقرأ الأوراق الأربع، ويضيف الحسابات والصناديق والفروع غير الموجودة. يُقرأ التاريخ من <strong>داخل الملف</strong> لأن أسماء هذه الملفات غير دقيقة، ويظهر لك للتأكيد.</li>
      </ul>
      <p><strong>كمهمة إقفال:</strong> أضف بنداً من نوع «إقفال البنوك والصندوق» للمحاسب المسؤول. لا يُرسل للاعتماد إلا بعد إدخال كل الحسابات والصناديق ووسيط كل الفروع، وكتابة ملاحظة لكل فرق في البنوك أو الصندوق.</p>
    </section>
    <section id="g-org">
      <h2>الهيكل التنظيمي: القطاعات والشركات</h2>
      <div class="flow"><span class="chip acc">المجموعة</span><span class="arr">←</span><span class="chip info">القطاعات</span><span class="arr">←</span><span class="chip info">الشركات</span><span class="arr">←</span><span class="chip">الأقسام</span><span class="chip">الفروع</span></div>
      <ol>
        <li>من «الهيكل التنظيمي» اضغط <strong>«قطاع»</strong> لإضافة قطاع، مثل قطاع التجزئة والكماليات، أو قطاع الجملة، أو قطاع الصناعة.</li>
        <li>اضغط <strong>«شركة»</strong>، أو زر «+ شركة» داخل القطاع، وأدخل اسم الشركة وقطاعها والسجل التجاري والرقم الضريبي.</li>
        <li>داخل كل شركة أضف <strong>أقسامها</strong> و<strong>فروعها</strong>. أقسام الإدارة المالية التي تخدم كل المجموعة تُترك «على مستوى المجموعة».</li>
      </ol>
      <p>إذا كانت لديك فروع مستوردة من قبل، فاضغط <strong>«إنشاؤها كشركات وربط فروعها»</strong> لإنشاء الشركات من أسماء المنشآت في الفروع تلقائياً، ثم حدّد قطاع كل شركة. وفي «تقرير الإيرادات» يمكن التصفية حسب <strong>القطاع</strong> ثم الشركة ثم الفرع.</p>
    </section>
    <section id="g-perm">
      <h2>الصلاحيات</h2>
      <p>من صفحة <strong>«الصلاحيات»</strong> يحدد المدير المالي لكل مستخدم:</p>
      <ul>
        <li><strong>الصفحات التي تظهر له:</strong> الصفحات غير المسموحة تختفي من القائمة ولا يمكن فتحها. وتظهر صفحتا «تسجيل الإيرادات» و«البنوك والصندوق» تلقائياً لمن أُسند إليه بند منهما.</li>
        <li><strong>الإجراءات المسموحة:</strong> الاعتماد، والإدخال نيابة عن الآخرين، وإسناد المهام، وتسجيل الإيرادات واستيرادها، والبنوك والصندوق، والتصدير، وحذف المرفقات، وإدارة الهيكل والإعداد والنسخ الاحتياطي والصلاحيات.</li>
        <li><strong>نطاق البيانات:</strong> كل الإدارة المالية، أو قسمه فقط، أو بياناته فقط. ويطبَّق على لوحة المتابعة والإقفالات والمهام والأداء والمرفقات والسجل والإيرادات.</li>
        <li><strong>الفروع المسموحة:</strong> لتقييد الموظف بفروع محددة في تسجيل الإيرادات وتقرير الإيرادات ووسيط المتحصلات. إذا لم تحدد فروعاً، يرى كل الفروع.</li>
      </ul>
      <h3>قوالب الأدوار</h3>
      <p>كل موظف يأخذ تلقائياً صلاحيات <strong>قالب دوره</strong> (رئيس قسم، أو محاسب). عدّل القالب مرة واحدة فيُطبَّق على كل أصحاب الدور. ولموظف بعينه اختر <strong>«صلاحيات مخصّصة»</strong>. أما المدير المالي فيملك كل الصلاحيات دائماً.</p>
      <div class="warnbox">قواعد قاعدة البيانات تمنع غير المصرّح لهم من تعديل الهيكل والإعداد والصلاحيات حتى لو تجاوزوا الواجهة. أما إخفاء الصفحات ونطاق البيانات فتطبّقه واجهة النظام.</div>
    </section>
    <section id="g-files">
      <h2>المرفقات والتقارير</h2>
      <p>يمكن إرفاق ملفات <strong>Excel</strong> و<strong>Word</strong> و<strong>PDF</strong> (وصور المستندات) بأي <strong>بند إقفال</strong> أو <strong>مهمة</strong>، مثل كشف البنك، أو محضر جرد الصندوق، أو تقرير المصاريف، أو ملف التسوية.</p>
      <ol>
        <li>افتح بند الإقفال أو المهمة، ثم انزل إلى قسم «المرفقات».</li>
        <li>اضغط «إرفاق ملف» واختر ملفاً أو أكثر. حجم الملف الواحد حتى 5 ميجابايت.</li>
        <li>يظهر بجانب البند أو المهمة رمز مشبك مع عدد المرفقات.</li>
      </ol>
      <p>صفحة <strong>«المرفقات والتقارير»</strong> تجمع كل الملفات في مكان واحد، مع البحث بالاسم والتصفية حسب القسم ونوع الملف. اضغط اسم البند أو المهمة لفتحه مباشرة.</p>
      <p><strong>الحذف:</strong> يحذف الملف من رفعه، أو رئيس قسمه، أو المدير المالي.</p>
      <div class="tip">ملفات PDF والصور تُفتح مباشرة في المتصفح، وملفات Excel وWord تُنزَّل لتفتحها في برامجها.</div>
    </section>
    <section id="g-routine">
      <h2>روتين العمل المقترح</h2>
      <h3>المحاسب — كل صباح</h3>
      <ol><li>أقفل بنود يوم العمل السابق وأرسلها قبل الموعد.</li><li>إن وجد فرقاً فليكتب تفسيره بوضوح: السبب، ومتى يُسوّى.</li><li>يراجع مهامه ويحدّث حالاتها.</li></ol>
      <h3>رئيس القسم — قبل الظهر</h3>
      <ol><li>يعتمد المرسل أو يرجعه.</li><li>يتابع من لم يُرسل حتى الآن.</li><li>يراجع الفروقات المفتوحة في قسمه.</li></ol>
      <h3>المدير المالي — يومياً (10 دقائق)</h3>
      <ol><li>يراجع لوحة المتابعة: نسبة الإقفال، والمتأخر، والفروقات، والإجماليات.</li><li>يعتمد إقفالات رؤساء الأقسام.</li></ol>
      <h3>المدير المالي — أسبوعياً</h3>

const canFill=it=>canWrite&&(it.assignee===me||isCFO()||(can("close.others")&&scopeMember(it.assignee)));
const canApprove=it=>canWrite&&it.status==="submitted"&&(isCFO()||(can("close.approve")&&scopeMember(it.assignee)&&it.assignee!==me));
const canAdmin=()=>can("setup.manage")||can("org.manage");

/* ================= data layer ================= */
let db=null,daysReady=false,extra=null;
const Data={
  mode:"connecting",
  async init(){
    const C=window.MASAR_CONFIG||{},f=C.firebase||{};
    if(f.apiKey&&f.projectId){
      ownerEmail=String(C.ownerEmail||"").trim().toLowerCase();ownerHash=String(C.ownerEmailSha256||"").trim().toLowerCase();
      gate("loading");
      try{await loadFirebase()}catch(e){gate("error");return}
      firebase.initializeApp(f);fbAuth=firebase.auth();db=firebase.firestore();
      try{await db.enablePersistence({synchronizeTabs:true})}catch(e){}
      fbAuth.onAuthStateChanged(u=>{
        authUser=u;
        if(!u)return gate("login");
        if(!u.emailVerified)return gate("verify");
        gate(null);if(!fbStarted){fbStarted=true;Data.startFb()}
      });
      return;
    }
    this.mode="local";
    try{const raw=JSON.parse(lsGet("crm_local2")||"{}");COLS.forEach(c=>{if(Array.isArray(raw[c]))state[c]=raw[c]});if(raw.days)state.days=raw.days;if(raw.config)state.config=raw.config;if(Array.isArray(raw.files))state.files=raw.files;if(raw.rev)state.rev=raw.rev;if(raw.bc)state.bc=raw.bc;if(raw.orgUnits)state.orgUnits=raw.orgUnits}catch(e){}
    rebuildOrg();
    COLS.forEach(c=>ready[c]=true);ready.config=true;daysReady=true;
    paintConn();afterData();
  },
  async startFb(){
    const em=String(authUser.email||"").toLowerCase();
    isOwnerV=!!ownerEmail&&em===ownerEmail;
    if(!isOwnerV&&ownerHash&&window.crypto&&crypto.subtle){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(em));isOwnerV=[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")===ownerHash}catch(e){}}
    this.mode="db";
    const rows=s=>s.docs.map(d=>Object.assign({},d.data(),{id:d.id}));
    ["team","depts","lines","tasks","branches","bankAccts","cashBoxes"].forEach(c=>db.collection(c).onSnapshot(s=>{state[c]=rows(s);ready[c]=true;afterData()},subErr));
    db.collection("activity").orderBy("at","desc").limit(150).onSnapshot(s=>{state.activity=rows(s);ready.activity=true;afterData()},subErr);
    db.doc("setup/config").onSnapshot(s=>{state.config=s.exists?s.data():null;ready.config=true;afterData()},subErr);
    db.doc("setup/orgUnits").onSnapshot(s=>{state.orgUnits=s.exists?s.data():{};rebuildOrg();ready.org=true;afterData()},subErr);
    db.collection("days").where("date",">=",WIN).onSnapshot(s=>{
      const m={};Object.keys(state.days).forEach(k=>{if(k<WIN)m[k]=state.days[k]});
      s.docs.forEach(d=>{m[d.id]=d.data()});state.days=m;daysReady=true;afterData()},subErr);
    db.collection("bc").where("date",">=",WIN).onSnapshot(s=>{
      const m={};Object.keys(state.bc).forEach(k=>{if(k<WIN)m[k]=state.bc[k]});
      s.docs.forEach(d=>{m[d.id]=d.data()});state.bc=m;ready.bc=true;afterData()},subErr);
    db.collection("rev").where("date",">=",WIN).onSnapshot(s=>{
      const m={};Object.keys(state.rev).forEach(k=>{if(k<WIN)m[k]=state.rev[k]});
      s.docs.forEach(d=>{m[d.id]=d.data()});state.rev=m;ready.rev=true;afterData()},subErr);
    if(isOwnerV)db.doc("setup/access").onSnapshot(s=>{accessEmails=s.exists?(s.data().emails||[]):[];accessAdmins=s.exists?(s.data().admins||[]):[];ready.access=true;afterData()},subErr);
    paintConn();schedule();
  },
  persist(){lsSet("crm_local2",JSON.stringify(state))},
  async put(col,rec){
    const body=Object.assign({},rec);const id=body.id||uid();delete body.id;
    if(this.mode==="db")await db.collection(col).doc(id).set(body);
    else{const i=state[col].findIndex(r=>r.id===id);const row=Object.assign({},body,{id});if(i>=0)state[col][i]=row;else state[col].push(row);this.persist();schedule()}
    return id;
  },
  async del(col,id){
    if(this.mode==="db")await db.collection(col).doc(id).delete();
    else{state[col]=state[col].filter(r=>r.id!==id);this.persist();schedule()}
  },
  async setConfig(obj){
    if(this.mode==="db")await db.doc("setup/config").set(obj);
    else{state.config=obj;this.persist();schedule()}
  },
  async dayCreate(date,items,extra){
    const body=Object.assign({date,items,createdAt:Date.now()},extra||{});
    if(this.mode==="db"){const ref=db.doc("days/"+date);const s=await ref.get();if(s.exists)return false;await ref.set(body);return true}
    if(state.days[date])return false;state.days[date]=body;this.persist();schedule();return true;
  },
  async dayPatch(date,id,patch,fullItems){
    if(this.mode==="db"){
      const ref=db.doc("days/"+date);const upd={};Object.keys(patch).forEach(k=>{upd["items."+id+"."+k]=patch[k]});
      try{await ref.update(upd)}
      catch(e){
        if(e&&e.code==="not-found"){const items=Object.assign({},fullItems||{});items[id]=Object.assign({},items[id],patch);await ref.set({date,items,createdAt:Date.now()});return}
        throw e;
      }
      return;
    }
    const d=state.days[date]||(state.days[date]={date,items:Object.assign({},fullItems||{})});
    d.items[id]=Object.assign({},d.items[id],patch);this.persist();schedule();
  },
  async dayDelete(date){if(this.mode==="db")await db.doc("days/"+date).delete();else{delete state.days[date];this.persist();schedule()}}
};
function subErr(e){console.warn(e);if(e&&e.code==="permission-denied"){gate("denied");return}toast("انقطع الاتصال بقاعدة البيانات — أعد تحميل الصفحة")}
function watchDay(date){
  if(Data.mode!=="db"||date>=WIN){if(extra){extra.unsub();extra=null}return}
  if(extra&&extra.date===date)return;
  if(extra)extra.unsub();
  const cur={date,ready:false,unsub:()=>{}};extra=cur;
  const u1=db.doc("days/"+date).onSnapshot(s=>{if(s.exists)state.days[date]=s.data();else delete state.days[date];cur.ready=true;afterData()},e=>subErr(e));
  const u2=db.doc("rev/"+date).onSnapshot(s=>{if(s.exists)state.rev[date]=s.data();else delete state.rev[date];afterData()},e=>subErr(e));
  const u3=db.doc("bc/"+date).onSnapshot(s=>{if(s.exists)state.bc[date]=s.data();else delete state.bc[date];afterData()},e=>subErr(e));
  cur.unsub=()=>{u1();u2();u3()};
}
function writeErr(e){
  const code=e&&e.code;
  if(code==="permission-denied")toast("تعذّر الحفظ — لا تملك صلاحية. تأكد أن بريدك مضاف في الهيكل التنظيمي");
  else if(code==="resource-exhausted")toast("تم تجاوز الحصة اليومية لقاعدة البيانات — حاول لاحقاً");
  else if(code==="unavailable")toast("لا يوجد اتصال بالإنترنت — حاول مرة أخرى");
  else toast("تعذّر الحفظ، حاول مرة أخرى");
  console.warn(e);
}

const companyByName=n=>{const k=normAr(n);return k?state.companies.find(c=>normAr(c.name)===k):null};

async function save(col,rec,logText){

  if(col==="branches"){const c=rec.companyId&&byId("companies",rec.companyId);if(c)rec.company=c.name;else if(rec.company){const m=companyByName(rec.company);rec.companyId=m?m.id:""}}
  try{rec.updatedAt=Date.now();if(!rec.createdAt)rec.createdAt=rec.updatedAt;

async function log(text){

async function updateItem(it,patch,logText){
  if(!canWrite){toast("وضع القراءة فقط");return false}
  patch.updatedAt=Date.now();
  let full=null;
  if(!state.days[it.date]){full={};dayItems(it.date).forEach(x=>{full[x.id]=baseItem(x)})}
  try{await Data.dayPatch(it.date,it.id,patch,full);if(logText)log(logText);return true}
  catch(e){writeErr(e);return false}
}

/* auto-create the viewed day's sheet once lines are known */
const ensured={};
async function ensureDay(date){
  if(!canWrite||ensured[date]||!isWork(date)||date>today()||!ready.lines||!ready.config)return;
  if(Data.mode==="db"){if(date>=WIN){if(!daysReady)return}else if(!extra||extra.date!==date||!extra.ready)return}
  const active=state.lines.filter(l=>l.active!==false&&lineStart(l)<=date);if(!active.length)return;
  ensured[date]=true;
  try{
    const doc=state.days[date];
    if(!doc){const items={};active.forEach(l=>{items[l.id]=baseItem(l)});await Data.dayCreate(date,items,active.every(l=>l.sample)?{sample:true}:null)}
    else{for(const l of active.filter(l=>!doc.items||!doc.items[l.id]))await Data.dayPatch(date,l.id,baseItem(l))}
  }catch(e){ensured[date]=false;console.warn(e)}
}

/* identity */
function afterData(){
  if(Data.mode==="db"&&authUser){
    const em=String(authUser.email||"").toLowerCase();const m=state.team.find(x=>String(x.email||"").trim().toLowerCase()===em);me=m?m.id:"";

}
async function syncAccess(){
  const em=m=>String(m.email||"").trim().toLowerCase();
  const want=[...new Set(state.team.map(em).filter(Boolean))].sort();
  const admins=[...new Set(state.team.filter(m=>{const p=permsOf(m);return p.full||ADMIN_ACTS.some(a=>p.actions.has(a))}).map(em).filter(Boolean))].sort();
  const have=(accessEmails||[]).slice().sort(),haveA=(accessAdmins||[]).slice().sort();
  if(syncingAccess||(want.join("|")===have.join("|")&&admins.join("|")===haveA.join("|")))return;
  syncingAccess=true;
  try{await db.doc("setup/access").set({emails:want,admins,updatedAt:Date.now()})}catch(e){console.warn(e)}
  syncingAccess=false;
}

function kpi(l,v,h,cls){return'<div class="kpi '+(cls||"")+'"><span class="l">'+l+'</span><span class="v">'+v+'</span><span class="h">'+h+"</span></div>"}
function dateNav(){
  const D=curDay();
  return'<div class="datenav"><button type="button" data-day="prev" aria-label="اليوم السابق">'+svg("prev")+'</button><input type="date" id="dayPick" value="'+D+'" max="'+today()+'" aria-label="التاريخ"><button type="button" data-day="next" aria-label="اليوم التالي"'+(D>=today()?" disabled":"")+">"+svg("next")+'</button></div><span class="dayname">'+fmtDay(D)+"</span>"+(isWork(D)?'<span class="chip num">موعد التسليم: '+fmtTs(dueTs(D))+"</span>":'<span class="chip">عطلة أسبوعية</span>')+(D!==defaultDay()?'<button class="btn sm ghost" data-day="default">العودة لليوم المستحق</button>':"");
}
function stackBar(items){
  const n=Math.max(1,items.length);
  return'<div class="stack">'+["approved","submitted","returned","draft","pending"].map(s=>{const c=items.filter(i=>i.status===s).length;return c?'<span style="width:'+(c/n*100)+"%;background:"+ISTC[s]+'" title="'+lbl(IST,s)+" "+c+'"></span>':""}).join("")+"</div>";
}
const istLegend=()=>'<div class="legend">'+["approved","submitted","returned","draft","pending"].map(s=>'<span><i style="background:'+ISTC[s]+'"></i>'+lbl(IST,s)+"</span>").join("")+"</div>";
function activityList(arr){

  return'<div class="list">'+arr.map(a=>'<div class="li">'+avatar(a.who)+'<div class="grow act"><b>'+esc(memberName(a.who)||"عضو غير محدد")+"</b> "+esc(a.text)+'</div><span class="muted num" style="font-size:12px;white-space:nowrap">'+ago(a.at)+"</span></div>").join("")+"</div>";
}
function memberSelect(id,val,withMe,deptFilter){
  return'<select class="select" id="'+id+'" aria-label="الموظف"><option value="all">كل الموظفين</option>'+(withMe&&me?'<option value="me"'+(val==="me"?" selected":"")+">الخاصة بي</option>":"")+sortedTeam().filter(m=>scopeMember(m.id)&&(!deptFilter||deptFilter==="all"||m.deptId===deptFilter)).map(m=>'<option value="'+esc(m.id)+'"'+(val===m.id?" selected":"")+">"+esc(m.name)+"</option>").join("")+"</select>";

function deptSelect(id,val){return'<select class="select" id="'+id+'" aria-label="القسم"><option value="all">كل الأقسام</option>'+state.depts.map(d=>'<option value="'+esc(d.id)+'"'+(val===d.id?" selected":"")+">"+esc(d.name)+"</option>").join("")+"</select>"}
function valSummary(it){
  const t=typeOf(it.typeK);
  if(t.mode==="bcform"){const b=bcSummary(it.date);return"بنوك "+nf.format(b.bk)+"/"+nf.format(b.bkT)+" · صناديق "+nf.format(b.bx)+"/"+nf.format(b.bxT)+" · وسيط "+nf.format(b.md)+"/"+nf.format(b.mdT)+(b.bkDiff+b.bxDiff?' · <span class="varbad">'+nf.format(b.bkDiff+b.bxDiff)+" فرق</span>":"")}
  if(t.mode==="revform"){const sm=revSummary(it);return nf.format(sm.done)+"/"+nf.format(sm.total)+" فرع"+(sm.done?" · فعلي <b>"+moneyShort(sm.act)+"</b> · صافي "+sgn(sm.net)+(sm.abn?' · <span class="varbad">'+nf.format(sm.abn)+" غير طبيعي</span>":""):"")}
  if(it.status==="pending")return'<span class="muted">لم يُدخل بعد</span>';
  if(it.noAct)return"لا توجد حركة";
  const cnt=hasVal(it.count)?nf.format(+it.count)+" مستند · ":"";
  if(t.mode==="reconcile"){const v=variance(it);return cnt+(hasVal(it.book)?"دفتري <b>"+moneyShort(it.book)+"</b> · ":"")+(v?'<span class="varbad">فرق '+nf2.format(v)+"</span>":hasVal(it.actual)?'<span style="color:var(--ok)">مطابق</span>':"")}
  return cnt+(hasVal(it.amount)?"<b>"+money(it.amount)+"</b>":"");
}
function groupByDept(items){
  const map={};items.forEach(i=>{const d=deptOf(i.assignee)||"_";(map[d]=map[d]||[]).push(i)});
  const order=state.depts.map(d=>d.id).concat(["_"]);
  return Object.keys(map).sort((a,b)=>order.indexOf(a)-order.indexOf(b)).map(k=>({id:k,name:k==="_"?"بدون قسم":deptName(k),items:map[k]}));
}

    kpi("بانتظار الاعتماد",nf.format(sub.length),mineA?"منها "+nf.format(mineA)+" بانتظارك أنت":"لا شيء بانتظارك",sub.length?"goldk":"")+
    kpi("متأخرة",nf.format(lateOpen),pastDue?"لم تُرسل رغم مضي الموعد · أُرسل متأخراً "+nf.format(lateDone):"الموعد لم يحن بعد",lateOpen?"alert":"")+
    kpi("فروقات مطابقة",nf.format(vars.length),vars.length?"مجموع الفروقات "+money(varSum):"كل المطابقات سليمة",vars.length?"alert":"")+
  "</div>";

  const tt=types().map(t=>{const its=items.filter(i=>i.typeK===t.k);if(!its.length)return"";const c=its.filter(isClosed).length;
    if(t.mode==="bcform"){const b=bcSummary(D),df=r2(b.bankAct-b.bankSys);return'<div class="tt"><span class="l">'+esc(t.l)+'</span><span class="v'+(df?" bad":"")+'">'+(df?"فرق البنوك "+nf2.format(df):"البنوك مطابقة")+'</span><span class="s num">بنوك '+nf.format(b.bk)+"/"+nf.format(b.bkT)+" · صناديق "+nf.format(b.bx)+"/"+nf.format(b.bxT)+" · "+nf.format(c)+"/"+nf.format(its.length)+" مُقفل</span></div>"}
    if(t.mode==="revform"){const sms=its.map(revSummary);const act=sms.reduce((a,x)=>a+x.act,0),ab=sms.reduce((a,x)=>a+x.abn,0),bd=sms.reduce((a,x)=>a+x.done,0),bt=sms.reduce((a,x)=>a+x.total,0);return'<div class="tt"><span class="l">'+esc(t.l)+'</span><span class="v'+(ab?" bad":"")+'">'+money(act)+'</span><span class="s num">'+nf.format(bd)+"/"+nf.format(bt)+" فرع مسجّل · "+nf.format(c)+"/"+nf.format(its.length)+" مُقفل"+(ab?" · "+nf.format(ab)+" غير طبيعي":"")+"</span></div>"}
    if(t.mode==="reconcile"){const v=its.reduce((s,i)=>s+variance(i),0);const nv=its.filter(i=>variance(i)!==0).length;return'<div class="tt"><span class="l">'+esc(t.l)+'</span><span class="v'+(nv?" bad":"")+'">'+(nv?"فرق "+nf2.format(v):"مطابق")+'</span><span class="s num">'+nf.format(c)+"/"+nf.format(its.length)+" مُقفل"+(nv?" · "+nf.format(nv)+" بند بفرق":"")+"</span></div>"}
    const sum=its.reduce((s,i)=>s+(hasVal(i.amount)?+i.amount:0),0);return'<div class="tt"><span class="l">'+esc(t.l)+'</span><span class="v">'+money(sum)+'</span><span class="s num">'+nf.format(c)+"/"+nf.format(its.length)+" مُقفل</span></div>"}).join("");
  h+='<div class="grid-2"><div class="panel"><h2>الإقفال حسب القسم <span class="muted">'+fmtDay(D)+"</span></h2>"+deptRows+'</div><div class="panel"><h2>إجماليات اليوم حسب النوع</h2>'+(tt?'<div class="ttl">'+tt+"</div>":'<div class="empty">لا توجد بيانات</div>')+"</div></div>";

  return h;

function heatmap(){
  const end=isWork(today())?today():prevWork(today());const days=lastNWork(12,end);
  const cache={};days.forEach(d=>cache[d]=dayItems(d));
  const members=sortedTeam().filter(m=>scopeMember(m.id)).filter(m=>state.lines.some(l=>l.assignee===m.id)||days.some(d=>cache[d].some(i=>i.assignee===m.id)));
  if(!members.length)return'<div class="empty">تظهر الخريطة بعد إضافة بنود الإقفال</div>';
  const byDept={};members.forEach(m=>{const k=m.deptId||"_";(byDept[k]=byDept[k]||[]).push(m)});
  const order=state.depts.map(d=>d.id).concat(["_"]);
  let rows="";
  Object.keys(byDept).sort((a,b)=>order.indexOf(a)-order.indexOf(b)).forEach(k=>{
    rows+='<tr class="dep"><td colspan="'+(days.length+1)+'">'+esc(k==="_"?"بدون قسم":deptName(k))+"</td></tr>";
    byDept[k].forEach(m=>{
      rows+='<tr><td class="nm">'+esc(m.name)+"</td>"+days.map(d=>{
        const its=cache[d].filter(i=>i.assignee===m.id);if(!its.length)return'<td><span class="hc hn"></span></td>';
        const c=its.filter(isClosed).length,ap=its.filter(i=>i.status==="approved").length,late=its.some(i=>isClosed(i)&&lateOf(i));const past=Date.now()>dueTs(d);
        const cls=ap===its.length?"h4":c===its.length?"h3":c>0?"h2":past?"h0":"hf";
        const tip=m.name+" — "+fmtDay(d)+": "+c+"/"+its.length+" مُقفل، "+ap+" معتمد"+(late?"، يوجد إرسال متأخر":"");
        return'<td><button type="button" class="hc '+cls+(late?" late":"")+'" data-goday="'+d+'" title="'+esc(tip)+'" aria-label="'+esc(tip)+'"></button></td>'}).join("")+"</tr>";
    });
  });
  return'<div class="hmwrap"><table class="hm"><thead><tr><th></th>'+days.map(d=>"<th>"+DAYS3[parseD(d).getDay()]+'<br><span class="num">'+nf.format(parseD(d).getDate())+"</span></th>").join("")+"</tr></thead><tbody>"+rows+'</tbody></table></div><div class="legend"><span><i style="background:var(--ok)"></i>كل البنود معتمدة</span><span><i style="background:var(--ok-mid)"></i>كل البنود مُرسلة</span><span><i style="background:var(--warn)"></i>بعض البنود فقط</span><span><i style="background:var(--bad)"></i>لم يُقفل شيء وتجاوز الموعد</span><span><i style="background:var(--surface-2);outline:1px dashed var(--line-2)"></i>لم يحن الموعد</span><span>● إرسال متأخر</span></div>';
}
function taskList(arr,emptyMsg){

    return'<div class="li"><button type="button" class="check'+(t.status==="done"?" on":"")+'" data-toggle="'+esc(t.id)+'" aria-label="تم الإنجاز"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></button><div class="grow" data-open="tasks:'+esc(t.id)+'" style="cursor:pointer"><div class="t">'+esc(t.title)+'</div><div class="s">'+esc(memberName(t.assignee)||"غير مسند")+" · "+esc(t.category||"")+'</div></div><span class="chip '+p.c+'">'+p.l+'</span><span class="chip '+(od?"bad":"")+' num">'+(t.due?fmtDate(t.due):"بلا موعد")+"</span></div>"}).join("")+"</div>";

      });

/* ---- performance ---- */
function periodRange(){
  const t=today();const d=parseD(t);
  if(ui.period==="week")return[shiftD(t,-d.getDay()),t];
  if(ui.period==="month")return[t.slice(0,8)+"01",t];
  if(ui.period==="last"){const f=new Date(d.getFullYear(),d.getMonth()-1,1);const l=new Date(d.getFullYear(),d.getMonth(),0);return[isoLocal(f),isoLocal(l)]}
  return[shiftD(t,-29),t];
}
function perfData(){
  const [from,to]=periodRange();const now=Date.now();
  const days=workDays(from,to).filter(d=>dueTs(d)<now);
  const P={};const get=id=>P[id]||(P[id]={id,exp:0,done:0,onTime:0,late:0,missed:0,ret:0,vars:0,appr:0,tDone:0,tOver:0,tOpen:0});
  days.forEach(d=>dayItems(d).forEach(i=>{if(!i.assignee)return;const p=get(i.assignee);p.exp++;
    if(isClosed(i)){p.done++;if((i.submittedAt||0)<=dueTs(d))p.onTime++;else p.late++}else{p.missed++;p.late++}
    if(i.status==="approved")p.appr++;p.ret+=+i.returns||0;if(variance(i)!==0)p.vars++}));
  state.tasks.forEach(t=>{if(!t.assignee)return;const p=get(t.assignee);if(t.status==="done"){if(t.doneAt&&t.doneAt>=from&&t.doneAt<=to)p.tDone++}else{p.tOpen++;if(t.due&&t.due<today())p.tOver++}});
  Object.values(P).forEach(p=>{p.rate=p.exp?p.onTime/p.exp:null;const tr=(p.tDone+p.tOver)?p.tDone/(p.tDone+p.tOver):1;p.score=(p.exp||p.tDone||p.tOver)?Math.round(((p.rate==null?1:p.rate)*70)+tr*30):null});
  return{P,days,from,to};
}
VIEWFN.perf=function(){
  const {P,days,from,to}=perfData();
  let h='<div class="toolbar"><div class="seg" role="group" aria-label="الفترة">'+[["week","هذا الأسبوع"],["month","هذا الشهر"],["last","الشهر الماضي"],["30","آخر 30 يوماً"]].map(p=>'<button type="button" data-period="'+p[0]+'" aria-pressed="'+(ui.period===p[0])+'">'+p[1]+"</button>").join("")+"</div>"+deptSelect("perfDept",ui.perfDept)+'<span class="muted" style="font-size:12.5px">'+fmtDate(from)+" — "+fmtDate(to)+" · "+nf.format(days.length)+" يوم عمل مضى موعده</span></div>";
  const members=sortedTeam().filter(m=>scopeMember(m.id)&&(ui.perfDept==="all"||m.deptId===ui.perfDept));
  if(!members.length)return h+'<div class="empty">لا يوجد موظفون</div>';
  const depts=state.depts.filter(d=>ui.perfDept==="all"||d.id===ui.perfDept);
  if(depts.length)h+='<div class="kpis" style="grid-template-columns:repeat(auto-fill,minmax(230px,1fr))">'+depts.map(d=>{const ms=state.team.filter(m=>m.deptId===d.id).map(m=>P[m.id]).filter(Boolean);
    const exp=ms.reduce((s,p)=>s+p.exp,0),on=ms.reduce((s,p)=>s+p.onTime,0),td=ms.reduce((s,p)=>s+p.tDone,0),tov=ms.reduce((s,p)=>s+p.tOver,0);const r=exp?Math.round(on/exp*100):null;
    return kpi(esc(d.name),r==null?"—":nf.format(r)+"٪","في الموعد · إقفالات "+nf.format(ms.reduce((s,p)=>s+p.done,0))+"/"+nf.format(exp)+" · مهام منجزة "+nf.format(td)+(tov?" · متأخرة "+nf.format(tov):""),r!=null&&r<70?"alert":"")}).join("")+"</div>";
  const row=(m,p)=>{p=p||{exp:0,done:0,onTime:0,late:0,ret:0,vars:0,tDone:0,tOver:0,rate:null,score:null};
    const sc=p.score;const col=sc==null?"var(--line-2)":sc>=85?"var(--ok)":sc>=65?"var(--warn)":"var(--bad)";
    return"<tr><td>"+who(m.id)+'</td><td class="s">'+lbl(ROLES,m.role)+'</td><td class="num">'+nf.format(p.exp)+'</td><td class="num">'+nf.format(p.done)+'</td><td class="num">'+(p.rate==null?"—":nf.format(Math.round(p.rate*100))+"٪")+'</td><td class="num"'+(p.late?' style="color:var(--bad);font-weight:600"':"")+">"+nf.format(p.late)+'</td><td class="num">'+nf.format(p.ret)+'</td><td class="num">'+nf.format(p.vars)+'</td><td class="num">'+nf.format(p.tDone)+'</td><td class="num"'+(p.tOver?' style="color:var(--bad);font-weight:600"':"")+">"+nf.format(p.tOver)+'</td><td><div class="score"><div class="bar"><i style="width:'+(sc||0)+"%;background:"+col+'"></i></div><b class="num">'+(sc==null?"—":nf.format(sc))+"</b></div></td></tr>"};
  let body="";
  const groups={};members.forEach(m=>{const k=m.role==="cfo"?"__cfo":(m.deptId||"_");(groups[k]=groups[k]||[]).push(m)});
  const order=["__cfo"].concat(state.depts.map(d=>d.id),["_"]);
  Object.keys(groups).sort((a,b)=>order.indexOf(a)-order.indexOf(b)).forEach(k=>{
    body+='<tr class="sub"><td colspan="11">'+esc(k==="__cfo"?"الإدارة المالية":k==="_"?"بدون قسم":deptName(k))+"</td></tr>";
    groups[k].sort((a,b)=>roleRank(a)-roleRank(b)||((P[b.id]||{}).score??-1)-((P[a.id]||{}).score??-1)).forEach(m=>body+=row(m,P[m.id]));
  });
  h+='<div class="tablewrap"><table><thead><tr><th>الموظف</th><th>الدور</th><th>إقفالات مطلوبة</th><th>مُقفلة</th><th>في الموعد</th><th>متأخرة</th><th>مُعادة</th><th>بها فرق</th><th>مهام منجزة</th><th>مهام متأخرة</th><th>مؤشر الأداء</th></tr></thead><tbody>'+body+'</tbody></table></div><div class="muted" style="font-size:12.5px">مؤشر الأداء = 70٪ للإقفال في الموعد + 30٪ لإنجاز المهام دون تأخير. «مهام متأخرة» هي المهام المفتوحة التي تجاوزت موعدها الآن.</div>';
  return h;
};

async function orgMigrate(){
  if(!can("org.manage"))return;
  const names=[...new Set(state.branches.filter(b=>!companyOf(b)&&String(b.company||"").trim()).map(b=>String(b.company).trim()))];
  const made={};let n=0;
  for(const nm of names){const id=await save("companies",{name:nm,sectorId:"",order:state.companies.length+n});if(!id)return;made[normAr(nm)]=id;n++}
  for(const b of state.branches.filter(b=>!b.companyId&&made[normAr(b.company)]))await save("branches",Object.assign({},b,{companyId:made[normAr(b.company)]}));
  if(n)log("أنشأ "+n+" شركة من بيانات الفروع");toast("تم إنشاء "+nf.format(n)+" شركة — حدّد قطاع كل شركة من «تعديل»");
}

async function exportBackup(){
  try{
    const d={app:"masar",version:1,exportedAt:new Date().toISOString(),config:state.config,days:state.days,rev:state.rev,bc:state.bc,orgUnits:state.orgUnits};
    COLS.forEach(c=>{d[c]=state[c]});

      const as=await db.collection("activity").get();d.activity=as.docs.map(x=>Object.assign({},x.data(),{id:x.id}));
      const rs=await db.collection("rev").get();d.rev={};rs.docs.forEach(x=>{d.rev[x.id]=x.data()});
      const bs=await db.collection("bc").get();d.bc={};bs.docs.forEach(x=>{d.bc[x.id]=x.data()});

async function applyImport(){
  const d=pendingImport&&pendingImport.d;pendingImport=null;if(!d)return;
  if(Data.mode==="local"){COLS.forEach(c=>{state[c]=Array.isArray(d[c])?d[c]:[]});state.days=d.days||{};state.rev=d.rev||{};state.bc=d.bc||{};state.orgUnits=d.orgUnits||{};rebuildOrg();state.config=d.config||null;Data.persist();toast("تم الاسترجاع");afterData();return}
  try{
    const ops=[];
    COLS.forEach(c=>(d[c]||[]).forEach(r=>{const b=Object.assign({},r);const id=b.id;delete b.id;if(id)ops.push([db.collection(c).doc(String(id)),b])}));
    Object.keys(d.days||{}).forEach(k=>ops.push([db.doc("days/"+k),d.days[k]]));
    Object.keys(d.rev||{}).forEach(k=>ops.push([db.doc("rev/"+k),d.rev[k]]));
    Object.keys(d.bc||{}).forEach(k=>ops.push([db.doc("bc/"+k),d.bc[k]]));
    if(d.config)ops.push([db.doc("setup/config"),d.config]);
    if(d.orgUnits)ops.push([db.doc("setup/orgUnits"),d.orgUnits]);
    for(let i=0;i<ops.length;i+=400){const b=db.batch();ops.slice(i,i+400).forEach(o=>b.set(o[0],o[1]));await b.commit()}
    log("استرجع نسخة احتياطية ("+ops.length+" سجل)");toast("تم استرجاع "+nf.format(ops.length)+" سجل");
  }catch(e){writeErr(e)}
  render();
}

  }

  if(col==="tasks"){const prev=id?byId("tasks",id):null;if(rec.status==="done"&&(!prev||prev.status!=="done"))rec.doneAt=today();if(rec.status!=="done")rec.doneAt="";if(!id)rec.createdBy=me}
  let text=(id?"عدّل ":"أضاف ")+S.t+" «"+nm+"»";

  if(col==="tasks"&&id){const prev=byId("tasks",id);if(prev&&prev.status!==rec.status)text="غيّر حالة المهمة «"+nm+"» إلى «"+lbl(TSTATUS,rec.status)+"»"}
  if(col==="lines"&&!id)text+=" ("+typeOf(rec.typeK).l+") بمسؤولية "+memberName(rec.assignee);

  if(!newId)return;
  if(col==="team"&&rec.role==="head"&&rec.deptId){const d=byId("depts",rec.deptId);if(d&&!deptHead(d))await save("depts",Object.assign({},d,{headId:newId}))}
  if(col==="companies"&&id){const nm=rec.name;for(const b of state.branches.filter(b=>b.companyId===id&&b.company!==nm))await save("branches",Object.assign({},b,{company:nm}))}
  if(col==="depts"&&rec.headId){const m=byId("team",rec.headId);if(m&&(m.role!=="head"||m.deptId!==newId))await save("team",Object.assign({},m,{role:"head",deptId:newId}))}

function calcRev(r){r=r||{};const g=k=>+r[k]||0;const sysT=r2(g("sys_cash")+g("sys_net")),actT=r2(g("act_cash")+g("act_net")+g("act_transfer")+g("act_credit")),lc=r2(g("act_cash")-g("sys_cash")),ln=r2(g("act_net")+g("act_transfer")+g("act_credit")-g("sys_net")),net=r2(lc+ln);return{sysT,actT,lc,ln,net,cls:classify(net)}}

function branchOwner(date){

function revSummary(it){
  const bids=itemBranches(it),ab=revDoc(it.date).abn||{};let sys=0,act=0,net=0,done=0,abn=0;const abnNoNote=[];

  const M=modal;if(!M||M.kind!=="imp"||M.busy)return;
  document.querySelectorAll("[data-impd]").forEach(el=>{M.files[+el.dataset.impd].date=el.value});
  const files=M.files.filter(f=>f.date&&f.date<=today()&&(f.sales.length||f.terms.length||f.abn.length));
  if(!files.length){toast("لا توجد ملفات صالحة بتاريخ محدد");return}
  const created={},getB=async(name,company,terms)=>{const n=normAr(name);if(created[n])return created[n];const b=findBranch(name);if(b)return b.id;
    const id=await save("branches",{name:String(name).trim(),company:company||"",terminals:[...new Set(terms)].map(no=>({no})),active:true,order:state.branches.length+Object.keys(created).length});if(id)created[n]=id;return id};
  let done=0;
  try{
    for(const f of files){
      M.busy="جارٍ استيراد "+f.name+" ("+(done+1)+"/"+files.length+")…";paintImport();
      const patch={date:f.date,sales:{},terms:{},abn:{}};
      for(const x of f.sales){const bid=await getB(x.branch,x.company,f.terms.filter(t=>normAr(t.branch)===normAr(x.branch)).map(t=>t.no));if(!bid)throw new Error("branch");patch.sales[bid]=Object.assign({},x.vals,{notes:"",by:me||"",at:Date.now(),imported:true})}
      const newTerms={};
      for(const t of f.terms){const bid=await getB(t.branch,t.company,[t.no]);if(!bid)continue;(patch.terms[bid]=patch.terms[bid]||{})[t.no]=r2(t.amount);
        const b=byId("branches",bid);if(b&&!(b.terminals||[]).some(x=>String(x.no).trim()===t.no))(newTerms[bid]=newTerms[bid]||[]).push(t.no)}
      for(const bid of Object.keys(newTerms)){const b=byId("branches",bid);if(b)await save("branches",Object.assign({},b,{terminals:(b.terminals||[]).concat(newTerms[bid].map(no=>({no})))}))}
      f.abn.forEach((a,k)=>{const b=findBranch(a.branch);const bid=b?b.id:created[normAr(a.branch)];if(bid)patch.abn["imp_"+k]=Object.assign({branchId:bid,by:me||"",at:Date.now(),imported:true},a,{branch:undefined})});
      Object.values(patch.abn).forEach(a=>delete a.branch);
      await revWrite(f.date,patch);done++;
    }
    log("استورد "+done+" تقرير إيرادات يومي من Excel");repCache={key:"",docs:null,loading:false};
    closeModal();toast("تم استيراد "+nf.format(done)+" تقرير");
  }catch(e){writeErr(e);M.busy="";paintImport()}
}

const xlD=v=>typeof v==="number"&&v>30000&&v<80000?xlDate(v):(/^\d{4}-\d{2}-\d{2}/.test(String(v))?String(v).slice(0,10):"");
function parseBcBook(X,buf,name){
  const wb=X.read(buf,{type:"array"}),res={name,date:"",banks:[],med:[],col:[],box:[],warn:[]},dates=[];
  const sheet=k=>{const n=wb.SheetNames.find(x=>normAr(x).includes(k));return n?X.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:""}):null};
  const hdrDate=S=>{for(let i=0;i<4;i++)for(const v of S[i]||[]){const d=xlD(v);if(d)return d}return""};
  const col=(H,pred)=>H.findIndex(x=>pred(normAr(x)));
  const B=sheet("البنوك");
  if(B){const d=hdrDate(B);if(d)dates.push(["البنوك",d]);const hr=findHeader(B,r=>r.includes("البنك")&&r.some(x=>x.includes("مختصر")),8);
    if(hr>=0){const H=B[hr],cC=col(H,x=>x.includes("المنشا")),cB=col(H,x=>x==="البنك"),cA=col(H,x=>x.includes("مختصر")),cD=col(H,x=>x.includes("بيان")),cR=col(H,x=>x.includes("الفعلي")),cS=col(H,x=>x.includes("الاوائل")),cN=col(H,x=>x.includes("ملاحظات"));let co="";
      for(let i=hr+1;i<B.length;i++){const r=B[i]||[];if(normAr(r[cC])==="الاجمالي")break;if(normAr(r[cC]))co=String(r[cC]).trim();const acct=String(r[cA]==null?"":r[cA]).trim();if(!acct||!normAr(r[cB]))continue;
        res.banks.push({company:co,bank:String(r[cB]).trim(),acct,desc:cD>=0?String(r[cD]||"").trim():"",actual:isNum(r[cR])?r2(num(r[cR])):"",system:isNum(r[cS])?r2(num(r[cS])):"",notes:cN>=0?String(r[cN]||"").trim():""})}}}
  const parseBr=(S,kind)=>{if(!S)return;const d=hdrDate(S);if(d)dates.push([kind==="med"?"وسيط المتحصلات":"تحصيل النقدية",d]);
    const hr=findHeader(S,r=>r.includes("الفرع")&&(kind==="med"?r.some(x=>x.includes("تحصيل الصندوق")):r.some(x=>x.includes("ايداع"))),8);if(hr<0)return;
    const H=S[hr],cC=col(H,x=>x.includes("المنشا")),cB=col(H,x=>x==="الفرع"),cN=col(H,x=>x.includes("ملاحظات"));let co="";
    const c1=kind==="med"?col(H,x=>x.includes("تاريخ")):col(H,x=>x.includes("ايداع")),c2=kind==="med"?col(H,x=>x.includes("تحصيل الصندوق")):col(H,x=>x.includes("تاريخ")&&x.includes("تحصيل")),c3=kind==="med"?col(H,x=>x.includes("رصيد الوسيط")):col(H,x=>x==="التحصيل النقدي");
    for(let i=hr+1;i<S.length;i++){const r=S[i]||[];const a=normAr(r[cC]);if(a&&!a.startsWith("الاجم"))co=String(r[cC]).trim();const br=String(r[cB]||"").trim();if(!br)continue;
      if(kind==="med")res.med.push({company:co,branch:br,closeDate:xlD(r[c1]),collected:isNum(r[c2])?r2(num(r[c2])):"",mediator:isNum(r[c3])?r2(num(r[c3])):"",notes:cN>=0?String(r[cN]||"").trim():""});
      else res.col.push({company:co,branch:br,lastDeposit:xlD(r[c1]),lastCollect:xlD(r[c2]),cash:isNum(r[c3])?r2(num(r[c3])):"",notes:cN>=0?String(r[cN]||"").trim():""})}};
  parseBr(sheet("وسيط"),"med");parseBr(sheet("تحصيل النقديه")||sheet("تحصيل النقدية"),"col");

    for(let i=0;i<S.length;i++){const r=S[i]||[],n=r.map(x=>normAr(x));
      if(n.some(x=>x.includes("التحصيل النقدي")))break;

      if(!H||!n[0]||n[0].startsWith("الاجم"))continue;if(!(isNum(r[H.a])||isNum(r[H.b])))continue;

  res.date=(dates[0]||[])[1]||"";
  const nm=String(name).match(/(\d{1,2})\s*[-_.]\s*(\d{1,2})(?!\d)/);

}

  try{
